<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  
  <!-- Centered Image Placeholder Icon & Text -->
  <g transform="translate(960, 500)" text-anchor="middle">
    <!-- Image Icon Box -->
    <rect x="-60" y="-80" width="120" height="90" rx="12" fill="#94a3b8" opacity="0.6" />
    <circle cx="-25" cy="-45" r="10" fill="#f8fafc" />
    <polygon points="-45,-5 -10,-40 20,-10" fill="#f8fafc" />
    <polygon points="5,-18 30,-48 55,-5" fill="#f8fafc" />
    
    <text y="45" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#475569">
      Placeholder Image
    </text>
    <text y="75" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">
      1920 × 1080
    </text>
  </g>
</svg>
